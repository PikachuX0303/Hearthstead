plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Mod Menu and Cloth Config, both optional at runtime.
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    // Cloth Config's small math library, nested in its jar; listed for the development client.
    maven {
        name = "shedaniel"
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel.cloth"
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "hearthstead" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "hearthstead-gametest"
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional: Mod Menu shows a config button, Cloth Config draws the settings screen.
    modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    modCompileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
    // Cloth Config in the development client, so the client test can open the screen.
    modLocalRuntime "maven.modrinth:cloth-config:${project.cloth_config_version}"
    localRuntime "me.shedaniel.cloth:basic-math:0.6.1"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
    // Credits and license of the MineColonies building blueprints.
    from("NOTICE.md") {
        rename { "NOTICE_${inputs.properties.archivesName}.md" }
    }
}
